
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Directory | Draft EuroLeague</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Draft EuroLeague</a>
            <a class="btn btn-outline-light" href="/">Home</a>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="fw-bold mb-2">Player Directory</h1>
        <p class="text-secondary mb-4">
            Search EuroLeague players and filter by team or position.
        </p>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="search" class="form-label">Search player</label>
                <input
                    id="search"
                    class="form-control"
                    placeholder="Enter a player's name..."
                >
            </div>

            <div class="col-md-4">
                <label for="teamFilter" class="form-label">Team</label>
                <select id="teamFilter" class="form-select">
                    <option value="">All teams</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="positionFilter" class="form-label">Position</label>
                <select id="positionFilter" class="form-select">
                    <option value="">All positions</option>
                    <option value="PG">Point Guard (PG)</option>
                    <option value="SG">Shooting Guard (SG)</option>
                    <option value="SF">Small Forward (SF)</option>
                    <option value="PF">Power Forward (PF)</option>
                    <option value="C">Center (C)</option>
                </select>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <p id="resultCount" class="text-secondary">
                    Loading players...
                </p>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Team</th>
                                <th>Position</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody id="playerTable">
                            <tr>
                                <td colspan="4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById("search");
        const teamFilter = document.getElementById("teamFilter");
        const positionFilter = document.getElementById("positionFilter");
        const playerTable = document.getElementById("playerTable");
        const resultCount = document.getElementById("resultCount");

        async function loadPlayers() {
            const params = new URLSearchParams();

            params.set("search", searchInput.value.trim());
            params.set("team", teamFilter.value);
            params.set("position", positionFilter.value);

            try {
                const response = await fetch(
                    `/api/players?${params.toString()}`
                );

                if (!response.ok) {
                    throw new Error("Could not load players");
                }

                const players = await response.json();

                // Populate the team filter from the returned data.
                // Keep the currently selected team if possible.
                const selectedTeam = teamFilter.value;
                const teams = [...new Set(
                    players.map(player => player.team)
                )].sort();

                // When a filter is active, the API returns only matching
                // teams. The full team list is loaded separately below.
                if (!teamFilter.dataset.initialized) {
                    await loadTeams();
                }

                playerTable.replaceChildren();

                resultCount.textContent =
                    `${players.length} player(s) found`;

                if (players.length === 0) {
                    const row = playerTable.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 4;
                    cell.textContent = "No players match your filters.";
                    return;
                }

                players.forEach(player => {
                    const row = playerTable.insertRow();

                    [
                        player.name,
                        player.team,
                        player.position,
                        player.rating
                    ].forEach(value => {
                        const cell = row.insertCell();
                        cell.textContent = value;
                    });
                });

                // Restore the selected team if it is still available.
                if (selectedTeam) {
                    teamFilter.value = selectedTeam;
                }
            } catch (error) {
                playerTable.replaceChildren();
                const row = playerTable.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 4;
                cell.textContent =
                    "Could not load players. Check the Flask terminal.";
                resultCount.textContent = "Error loading data";
                console.error(error);
            }
        }

        async function loadTeams() {
            try {
                const response = await fetch("/api/teams");

                if (!response.ok) {
                    throw new Error("Could not load teams");
                }

                const teams = await response.json();

                teams.forEach(team => {
                    const option = document.createElement("option");
                    option.value = team.name;
                    option.textContent = team.name;
                    teamFilter.appendChild(option);
                });

                teamFilter.dataset.initialized = "true";
            } catch (error) {
                console.error(error);
            }
        }

        searchInput.addEventListener("input", loadPlayers);
        teamFilter.addEventListener("change", loadPlayers);
        positionFilter.addEventListener("change", loadPlayers);

        loadPlayers();
    </script>
</body>
</html>
