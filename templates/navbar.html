<nav class="navbar navbar-expand-lg navbar-dark main-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='teams_logos/euroleague.png') }}"
                 alt="EuroLeague Logo" class="navbar-logo">
            <span class="navbar-brand-title">DRAFT <span>EUROLEAGUE</span></span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbarLinks" aria-controls="mainNavbarLinks"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbarLinks">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                   href="{{ url_for('home') }}">Home</a>
                <a class="nav-link {% if request.endpoint == 'player_directory' %}active{% endif %}"
                   href="{{ url_for('player_directory') }}">Players</a>
                <a class="nav-link {% if request.endpoint in ['team_directory', 'team_profile'] %}active{% endif %}"
                   href="{{ url_for('team_directory') }}">Teams</a>
                
                <a class="nav-link {% if request.endpoint == 'draft' %}active{% endif %}"
                    href="{{ url_for('draft_mode') }}"> Draft</a>

                <span class="nav-link nav-link-soon" title="Fantasy mode is coming soon">Fantasy <small>SOON</small></span>
                
<a class="nav-link {% if request.endpoint == 'other_games' %}active{% endif %}"
   href="{{ url_for('other_games') }}">Others</a>

                
                <div class="navbar-divider d-none d-lg-block"></div>

                {% if current_user.is_authenticated %}
                    <a class="nav-link navbar-username {% if request.endpoint == 'profile' %}active{% endif %}"
                       href="{{ url_for('profile') }}">{{ current_user.username }}</a>
                    {% if current_user.role == 'admin' %}
                        <a class="nav-link {% if request.endpoint and request.endpoint.startswith('admin') %}active{% endif %}"
                           href="{{ url_for('admin_dashboard') }}">Admin</a>
                    {% endif %}
                    <form method="POST" action="{{ url_for('logout') }}" class="navbar-logout-form">
                        <button type="submit" class="nav-link navbar-logout">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    <a class="nav-link navbar-register" href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
