
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EuroLeague Schedule | Draft EuroLeague</title>

    <!-- BOOTSTRAP 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- EXISTING NAVBAR STYLING -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}">

    <!-- SCHEDULE PAGE STYLING -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/schedule.css') }}">
</head>

<body>

    <!-- ==================================================
         EXISTING WEBSITE NAVBAR
         ================================================== -->

    {% include 'navbar.html' %}


    <!-- ==================================================
         SCHEDULE PAGE
         ================================================== -->

    <main class="schedule-container">

        <!-- HERO SECTION -->

        <section class="schedule-hero">

            <div class="hero-label">
                THE FICTIONAL EUROLEAGUE
            </div>

            <h1>
                SEASON <span>SCHEDULE</span>
            </h1>

            <p>
                20 teams. 38 rounds. 380 games.
                Follow every matchup throughout the season.
            </p>

            <div class="season-info">

                <span id="season-name">
                    Loading season...
                </span>

                <span class="info-divider">/</span>

                <span id="season-status">
                    SCHEDULE
                </span>

            </div>

        </section>


        <!-- ==================================================
             WEEKLY FIXTURES
             ================================================== -->

        <section class="schedule-panel">

            <!-- WEEK NAVIGATION -->

            <div class="round-navigation">

                <button
                    id="previous-week"
                    class="navigation-button"
                    type="button"
                    aria-label="Previous week">
                    &#10094;
                </button>

                <div class="round-info">

                    <div class="round-label">
                        REGULAR SEASON
                    </div>

                    <h2 id="week-title">
                        ROUND 1
                    </h2>

                    <p id="week-subtitle">
                        Loading games...
                    </p>

                </div>

                <button
                    id="next-week"
                    class="navigation-button"
                    type="button"
                    aria-label="Next week">
                    &#10095;
                </button>

            </div>


            <!-- ROUND DROPDOWN -->

            <div class="week-selector-wrapper">

                <label for="week-selector">
                    Jump to round
                </label>

                <select
                    id="week-selector"
                    aria-label="Select EuroLeague round">
                </select>

            </div>


            <!-- API STATUS / ERRORS -->

            <div
                id="schedule-message"
                class="schedule-message"
                role="status"
                aria-live="polite">
            </div>


            <!-- GAME CARDS GENERATED BY JAVASCRIPT -->

            <div
                id="games-container"
                class="games-container">
            </div>

        </section>

    </main>


    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer class="schedule-footer">
        DRAFT EUROLEAGUE — FICTIONAL SEASON SIMULATION
    </footer>


    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <!-- BOOTSTRAP 5 JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- SCHEDULE API / WEEK NAVIGATION -->
    <script
        src="{{ url_for('static', filename='js/schedule.js') }}"
        defer>
    </script>

</body>
</html>
