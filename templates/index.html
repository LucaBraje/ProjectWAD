
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Draft EuroLeague</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/navbar.css') }}"
>
</head>

<body>
{% include 'navbar.html' %}

    <main class="container py-5">
        <h1>Build Your Legacy.</h1>

        <p class="text-secondary">
            Draft legends. Build your fantasy team. Compete with friends.
        </p>

        <div class="row g-3 mt-4">
            <div class="col-md-4">
                <div class="card p-4 h-100">
                    <h3>Player Database</h3>
                    <p>Explore EuroLeague players and their ratings.</p>
                    <a href="/players" class="btn btn-dark">
                        Browse Players
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 h-100">
                    <h3>Fantasy</h3>
                    <p>Build a team within your budget.</p>
                    <button class="btn btn-secondary" disabled>
                        Coming Soon
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 h-100">
                    <h3>All-Time Draft</h3>
                    <p>Create your ultimate EuroLeague lineup.</p>
                    <button class="btn btn-secondary" disabled>
                        Coming Soon
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
