
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ 'Edit Player' if player else 'Add Player' }} | Draft EuroLeague</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navbar.css') }}">
</head>

<body>
    {% include 'navbar.html' %}

    <main class="container py-5" style="max-width: 850px;">

        <h1 class="mb-4">
            {{ 'Edit Player' if player else 'Add New Player' }}
        </h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('admin_edit_player', player_id=player.id) if player else url_for('admin_add_player') }}">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Player Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ player.name if player else '' }}"
                           maxlength="100" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nationality</label>
                    <input type="text" name="nationality" class="form-control"
                           value="{{ player.nationality or '' if player else '' }}"
                           maxlength="50">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Team</label>
                    <select name="team_id" class="form-select" required>
                        {% for team in teams %}
                        <option value="{{ team.id }}"
                            {% if player and player.team_id == team.id %}selected{% endif %}>
                            {{ team.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Position</label>
                    <select name="position" class="form-select" required>
                        {% for position in ['PG', 'SG', 'SF', 'PF', 'C'] %}
                        <option value="{{ position }}"
                            {% if player and player.position == position %}selected{% endif %}>
                            {{ position }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">Player Picture URL</label>
                    <input type="url" name="picture_url" class="form-control"
                           value="{{ player.picture_url or '' if player else '' }}"
                           maxlength="200"
                           placeholder="https://example.com/player.jpg">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Overall Rating</label>
                    <input type="number" name="rating" class="form-control"
                           value="{{ player.rating if player else 70 }}"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Offense</label>
                    <input type="number" name="offense" class="form-control"
                           value="{{ player.offense if player else 70 }}"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Defense</label>
                    <input type="number" name="defense" class="form-control"
                           value="{{ player.defense if player else 70 }}"
                           min="0" max="100" required>
                </div>

<!-- PLAYER STATISTICS SECTION -->
<div class="col-12 mt-4">
    <h4>Player Statistics</h4>
    <hr>
</div>

<div class="col-md-4">
    <label class="form-label">Points Per Game (PPG)</label>
    <input type="number"
           name="points_per_game"
           class="form-control"
           value="{{ player.points_per_game if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

<div class="col-md-4">
    <label class="form-label">Assists Per Game (APG)</label>
    <input type="number"
           name="assists_per_game"
           class="form-control"
           value="{{ player.assists_per_game if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

<div class="col-md-4">
    <label class="form-label">Rebounds Per Game (RPG)</label>
    <input type="number"
           name="rebounds_per_game"
           class="form-control"
           value="{{ player.rebounds_per_game if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

<div class="col-md-4">
    <label class="form-label">Blocks Per Game (BPG)</label>
    <input type="number"
           name="blocks_per_game"
           class="form-control"
           value="{{ player.blocks_per_game if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

<div class="col-md-4">
    <label class="form-label">Steals Per Game (SPG)</label>
    <input type="number"
           name="steals_per_game"
           class="form-control"
           value="{{ player.steals_per_game if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

<div class="col-md-4">
    <label class="form-label">Field Goal Percentage (FG%)</label>
    <input type="number"
           name="fg_percentage"
           class="form-control"
           value="{{ player.fg_percentage if player else 0 }}"
           min="0" max="100" step="0.1" required>
</div>

            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">
                    {{ 'Save Changes' if player else 'Add Player' }}
                </button>

                <a href="{{ url_for('admin_players') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </main>
</body>
</html>
