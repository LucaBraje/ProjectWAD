
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Draft EuroLeague</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navbar.css') }}">
</head>

<body>

    {% include 'navbar.html' %}

    <main class="container py-5">

        <h1>Admin Dashboard</h1>

        <p>Welcome, {{ current_user.username }}!</p>

        <p>From here, you'll eventually be able to manage:</p>

        <ul>
            <li>EuroLeague teams</li>
            <li>Players and their ratings</li>
            <li>Player statistics</li>
            <li>Team biographies</li>
        </ul>
        <a href="{{ url_for('admin_players') }}"
   class="btn btn-primary mt-3">
    Manage Players
</a>
<a href="{{ url_for('admin_teams') }}"
   class="btn btn-primary mt-3 ms-2">
    Manage Teams
</a>
    </main>

</body>
</html>
